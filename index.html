<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKH TV - Streaming Sportif</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://akhh-3b20d-default-rtdb.europe-west1.firebasedatabase.app" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        :root { --bg: #0a0a0c; --card: #111114; --accent: #00ff88; --text: #ffffff; --gray: #888; --blue: #4488ee; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; display: flex; flex-direction: column; min-height: 100vh; }

        img.emoji { height: 1.2em; width: 1.2em; margin: 0 .05em 0 .1em; vertical-align: -0.1em; }

        /* ── HEADER PREMIUM ── */
        header { 
            padding: 20px 25px; 
            background: rgba(0,0,0,0.9); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 5px 25px rgba(0, 255, 136, 0.15);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        header h1 { 
            margin: 0; 
            font-family: 'Orbitron', sans-serif; 
            font-size: 1.8rem; 
            font-weight: 900; 
            letter-spacing: 4px; 
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        header h1 span { color: var(--accent); }

        .global-counter { 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem; 
            color: #ff4444; 
            background: rgba(255, 68, 68, 0.1); 
            padding: 6px 15px; 
            border-radius: 50px; 
            border: 1px solid rgba(255, 68, 68, 0.3);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── POPUPS ── */
        #interstitial { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: none; justify-content: center; align-items: center; }
        .interstitial-card { background: #111; padding: 40px 20px; border-radius: 24px; border: 1px solid var(--accent); text-align: center; width: 85%; max-width: 350px; position: relative; }
        .close-x { position: absolute; top: 15px; right: 20px; color: #444; font-size: 24px; cursor: pointer; font-weight: bold; }

        #adsterra-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .adsterra-card { background: #15151a; padding: 40px 25px; border-radius: 20px; border: 2px solid var(--accent); text-align: center; width: 85%; max-width: 340px; box-shadow: 0 0 30px rgba(0, 255, 136, 0.2); }
        .btn-ad-support { background: var(--accent); color: #000; border: none; padding: 15px; font-family: 'Orbitron', sans-serif; font-weight: 900; border-radius: 50px; cursor: pointer; width: 100%; margin-top: 20px; text-transform: uppercase; transition: 0.3s; }
        .btn-ad-support:hover { background: #fff; transform: scale(1.05); }

        /* ── BARRE SOCIALE ── */
        .social-bar { display: flex; justify-content: center; gap: 12px; margin: 25px auto; flex-wrap: wrap; padding: 0 15px; }
        .social-btn { 
            padding: 10px 20px; 
            border-radius: 50px; 
            text-decoration: none; 
            color: white; 
            font-weight: 800; 
            font-size: 0.7rem; 
            background: #1a1a20; 
            border: 1px solid #333; 
            text-transform: uppercase; 
            transition: 0.3s; 
        }
        .social-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
        .bg-iptv { border-color: #12bb57; color: #12bb57; }
        .bg-iptv:hover { background: #12bb57; color: #fff; }

        /* ── ANIMATION CHARGEMENT ── */
        .main-content { padding: 0 20px; max-width: 1200px; margin: auto; width: 100%; box-sizing: border-box; flex: 1; }
        #no-match { text-align: center; padding: 100px 20px; color: #888; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .loader-ball { font-size: 2.5rem; animation: bounce 0.5s cubic-bezier(0.5, 0.05, 1, 0.5) infinite alternate; }
        @keyframes bounce { 0% { transform: translateY(0) scaleY(0.9); } 100% { transform: translateY(-25px) scaleY(1.1); } }
        .loader-text { font-family: 'Orbitron', sans-serif; animation: pulseText 1.5s infinite; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-size: 0.75rem; }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ── CARTES ── */
        .sport-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem; 
            font-weight: 700;
            color: var(--accent); 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin: 45px 0 10px 0; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        .sport-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0, 255, 136, 0.4), transparent); }
        .comp-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; color: var(--gray); text-transform: uppercase; letter-spacing: 1.5px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 40px; }

        .card { 
            display: flex; 
            align-items: center; 
            background: var(--card); 
            border-radius: 16px; 
            padding: 15px; 
            border: 1px solid rgba(255,255,255,0.05); 
            position: relative; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .card:hover { border-color: var(--accent); transform: scale(1.02); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        
        .card-img { width: 100px; height: 75px; border-radius: 10px; object-fit: cover; margin-right: 18px; border: 1px solid #222; }
        .card-info { flex: 1; }
        .match-name { font-size: 0.95rem; font-weight: 700; margin: 0 0 12px 0; line-height: 1.3; color: #fff; }
        
        .btn-regarder { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 10px 22px; 
            border-radius: 50px; 
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; 
            font-size: 0.7rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2);
        }
        .btn-regarder:hover { background: #fff; transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2); }

        .btn-attente { 
            background: #222; 
            color: #555; 
            border: none; 
            padding: 10px 22px; 
            border-radius: 50px; 
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; 
            font-size: 0.7rem; 
            text-transform: uppercase;
        }

        .live-dot { font-size: 0.65rem; color: #ff4444; font-weight: 800; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .waiting-dot { font-size: 0.65rem; color: var(--gray); font-weight: 800; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; display: block; }
        .dot { width: 7px; height: 7px; background: #ff4444; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 5px red; } 50% { opacity: 0.3; } }

        .viewers-badge { position: absolute; top: 15px; right: 20px; font-family: 'Orbitron', sans-serif; color: #DEDEDE; font-size: 0.7rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;}

        footer { padding: 40px 15px; text-align: center; border-top: 1px solid rgba(255,255,255,0.03); margin-top: 50px; }
        .footer-links a { color: #555; text-decoration: none; font-size: 0.65rem; margin: 0 10px; text-transform: uppercase; font-family: 'Orbitron', sans-serif;}
    </style>
</head>
<body>

    <div id="interstitial">
        <div class="interstitial-card">
            <span class="close-x" onclick="closeInterstitial()">×</span>
            <h2 id="int-title" style="margin-top:0; font-family: 'Orbitron';">AKH TV</h2>
            <p id="int-text" style="color:#888; font-size:0.85rem">Chargement...</p>
            <a href="#" id="int-link" target="_blank" style="display:block; padding:15px; border-radius:50px; text-decoration:none; font-weight:800; color:#000; font-family: 'Orbitron'; background:var(--accent); margin-top:20px;">REJOINDRE</a>
        </div>
    </div>

    <div id="adsterra-modal">
        <div class="adsterra-card">
            <h2 style="font-family: 'Orbitron'; color: #fff; margin-top:0;">ACCÈS VIP</h2>
            <p style="color:#aaa; font-size:0.85rem;">Soutenez AKH TV en cliquant ci-dessous pour lancer le direct (Revenez ensuite ici).</p>
            <button id="btn-ad-trigger" class="btn-ad-support">LANCER LE MATCH</button>
        </div>
    </div>

    <header>
        <h1>AKH <span>TV</span></h1>
        <div class="global-counter">🔴 LIVE: <span id="global-count">0</span></div>
    </header>

    <div class="social-bar">
        <a href="https://discord.com/invite/9hDDERzTJe" target="_blank" class="social-btn">DISCORD</a>
        <a href="https://t.me/+ZwJc5nqhevYyMzM0" target="_blank" class="social-btn">TELEGRAM</a>
        <a href="iptv.html" class="social-btn bg-iptv">📺 OFFRE IPTV</a>

    </div>

    <div class="main-content" id="streams-container">
        <div id="no-match">
            <div class="loader-ball">⚽</div>
            <div class="loader-text">Initialisation des flux...</div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="dmca.html">DMCA</a>
            <a href="mentions.html">MENTIONS LÉGALES</a>
            <a href="https://discord.com/invite/9hDDERzTJe" target="_blank">CONTACT</a>
        </div>
        <p class="copyright" style="font-size: 0.7rem; color: #444; margin-top: 15px; font-family: 'Orbitron';">AKH TV &copy; 2026</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCznQgA4zvs1dhZQzqtPqjfabsbBhEmvhU", 
            authDomain: "akhh-3b20d.firebaseapp.com", 
            databaseURL: "https://akhh-3b20d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "akhh-3b20d", 
            storageBucket: "akhh-3b20d.firebasestorage.app", 
            messagingSenderId: "702428098406", 
            appId: "1:702428098406:web:6f164b6674c3fe6019e2a7" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        // MÉMOIRE GLOBALE POUR NE PAS RETOMBER A 0
        window.akhViewers = {};
        window.akhTotal = 0;

        window.updateViewersUI = function() {
            const globalCounter = document.getElementById('global-count');
            if (globalCounter) globalCounter.innerText = window.akhTotal;

            document.querySelectorAll('[id^="count-"]').forEach(el => {
                const mId = el.id.replace('count-', '');
                el.innerText = window.akhViewers[mId] || 0;
            });
        };

        function getParisTime(dateStr) {
            if (!dateStr) return 0;
            if (!dateStr.includes('Z') && !dateStr.includes('+')) {
                return new Date(dateStr + '+02:00').getTime();
            }
            return new Date(dateStr).getTime();
        }

        window.openMatchWithAd = function(matchId) {
            const adModal = document.getElementById('adsterra-modal');
            const adBtn = document.getElementById('btn-ad-trigger');
            
            adModal.style.display = 'flex';
            
            adBtn.onclick = function() {
                const lienAdsterra = 'https://alarmpenguinmelt.com/a6ejx46brv?key=44988478d22bea19cf3e0433beca9e52';
                window.open(lienAdsterra, '_blank');
                sessionStorage.setItem('pass_pub', 'valide');
                adModal.style.display = 'none';
                
                // REDIRECTION VERS LE DOSSIER VIP
                window.location.href = 'vip/?id=' + matchId;
            };
        };

        async function loadPopup() {
            if (!sessionStorage.getItem('popupSeen')) {
                try {
                    const popupsSnap = await getDocs(collection(db, "popups"));
                    const configs = [];
                    popupsSnap.forEach(doc => configs.push(doc.data()));

                    if (configs.length > 0) {
                        const selected = configs[Math.floor(Math.random() * configs.length)];
                        document.getElementById('int-title').innerText = selected.title;
                        document.getElementById('int-text').innerText = selected.text;
                        const iLink = document.getElementById('int-link');
                        iLink.href = selected.link; 
                        iLink.innerText = selected.btnText; 
                        iLink.style.background = selected.color;
                        
                        document.getElementById('interstitial').style.display = 'flex';
                    }
                } catch(error) {}
            }
        }
        loadPopup();

        window.closeInterstitial = function() { 
            document.getElementById('interstitial').style.display = 'none'; 
            sessionStorage.setItem('popupSeen', 'true');
        };

        onSnapshot(query(collection(db, "streams"), orderBy("priorite", "asc")), (snap) => {
            const cont = document.getElementById('streams-container');
            if (snap.empty) {
                cont.innerHTML = '<div id="no-match"><div class="loader-ball">⚽</div><div class="loader-text">Aucun match programmé</div></div>';
                return;
            }

            let finalHTML = '';
            const groups = {};

            snap.forEach(d => {
                const data = d.data();
                const s = data.sport || "Autres";
                const c = data.competition || "Direct";
                if(!groups[s]) groups[s] = {};
                if(!groups[s][c]) groups[s][c] = [];
                groups[s][c].push({id: d.id, ...data});
            });

            for(const s in groups) {
                finalHTML += `<div class="sport-title">${s}</div>`;
                for(const c in groups[s]) {
                    finalHTML += `<div class="comp-title">${c}</div>`;
                    finalHTML += `<div class="grid">`;
                    
                    groups[s][c].forEach(m => {
                        let statusHtml = '';
                        let buttonHtml = '';
                        let badgeHtml = '';
                        
                        let isLive = m.visible !== false;
                        let isCountdown = false;
                        
                        if (m.heureDebut) {
                            const matchTime = getParisTime(m.heureDebut);
                            const now = new Date().getTime();
                            if (matchTime > now) {
                                isLive = false;
                                isCountdown = true;
                            } else {
                                isLive = true;
                            }
                        }

                        if (isLive) {
                            statusHtml = `<div class="live-dot" id="status-${m.id}"><div class="dot"></div> EN DIRECT</div>`;
                            badgeHtml = `
                                <div class="viewers-badge" id="badge-${m.id}">
                                    👁️ <span id="count-${m.id}">${window.akhViewers[m.id] || 0}</span>
                                </div>`;
                            buttonHtml = `<button id="btn-${m.id}" onclick="openMatchWithAd('${m.id}')" class="btn-regarder">REGARDER</button>`;
                        } else {
                            if (isCountdown) {
                                statusHtml = `<div class="waiting-dot match-timer" id="status-${m.id}" data-time="${m.heureDebut}" data-id="${m.id}" data-live="false">⏳ CALCUL...</div>`;
                            } else {
                                statusHtml = `<div class="waiting-dot" id="status-${m.id}">⏳ BIENTÔT</div>`;
                            }
                            badgeHtml = `<div class="viewers-badge" id="badge-${m.id}" style="display:none;"></div>`;
                            buttonHtml = `<button id="btn-${m.id}" class="btn-attente" disabled>BIENTÔT</button>`;
                        }

                        finalHTML += `
                        <div class="card" id="card-${m.id}" style="${isLive ? '' : 'opacity: 0.7;'}">
                            <img src="${m.image}" class="card-img" onerror="this.src='https://via.placeholder.com/100x75/111/444?text=AKH'">
                            <div class="card-info">
                                ${statusHtml}
                                <h3 class="match-name">${m.nom}</h3>
                                ${buttonHtml}
                            </div>
                            ${badgeHtml}
                        </div>`;
                    });
                    
                    finalHTML += `</div>`;
                }
            }
            
            cont.innerHTML = finalHTML;

            if (window.twemoji) {
                twemoji.parse(cont);
            }
            window.updateViewersUI();
        });

        // SYSTÈME DE COMPTEUR ÉCONOMIQUE BLINDÉ (15 SECONDES)
        function fetchViewersData() {
            get(ref(rtdb, 'viewers')).then((snapshot) => {
                let tempViewers = {};
                let tempTotal = 0;
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (const mId in data) {
                        const count = Object.keys(data[mId]).length;
                        tempViewers[mId] = count;
                        tempTotal += count;
                    }
                }
                window.akhViewers = tempViewers;
                window.akhTotal = tempTotal;
                window.updateViewersUI();
            }).catch(err => console.error(err));
        }

        fetchViewersData();
        setInterval(fetchViewersData, 15000);

        setInterval(() => {
            const now = new Date().getTime();
            document.querySelectorAll('.match-timer').forEach(el => {
                if (el.dataset.live === "true") return;

                const matchTime = getParisTime(el.dataset.time);
                const diff = matchTime - now;
                
                if (diff > 0) {
                    const totalSeconds = Math.floor(diff / 1000);
                    const d = Math.floor(totalSeconds / 86400);
                    const h = Math.floor((totalSeconds % 86400) / 3600);
                    const m = Math.floor((totalSeconds % 3600) / 60);
                    const s = totalSeconds % 60;
                    
                    const format = (num) => num < 10 ? '0' + num : num;
                    const dayPart = d > 0 ? `${d}J ` : '';
                    el.innerHTML = `⏳ ${dayPart}${format(h)}H ${format(m)}M ${format(s)}S`;
                } else {
                    el.dataset.live = "true";
                    el.className = "live-dot";
                    el.innerHTML = `<div class="dot"></div> EN DIRECT`;
                    
                    const id = el.dataset.id;
                    const btn = document.getElementById('btn-' + id);
                    if(btn) {
                        btn.className = "btn-regarder";
                        btn.innerText = "REGARDER";
                        btn.disabled = false;
                        btn.onclick = () => openMatchWithAd(id);
                    }
                    
                    const card = document.getElementById('card-' + id);
                    if(card) card.style.opacity = '1';
                    const badge = document.getElementById('badge-'+id);
                    if(badge) badge.style.display = 'inline-flex';
                }
            });
        }, 1000);

    </script>
<script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.onkeydown = function(e) {
        if (e.keyCode == 123) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
    };
</script>

<style>
    body { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
</style>

</body>
</html>
