  <style>
    :root { --bg: #0a0a0c; --card: #111114; --accent: #00ff88; --border: rgba(0, 255, 136, 0.15); --text: #ffffff; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    .topbar { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 20px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 50; }
    .logo h1 { margin: 0; font-size: 1rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
    .btn-back { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-back:hover { background: rgba(0, 255, 136, 0.1); border-color: var(--accent); color: var(--accent); }

    .shell { display: flex; flex-direction: row; height: calc(100vh - 60px); max-width: 1920px; margin: 0 auto; overflow: hidden; }

    .col-left { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--card); padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; height: 100%; }
    .sb-live { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #ff4444; }
    .sb-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; animation: sbPulse 1s infinite; }
    @keyframes sbPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .sb-label { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; }
    .sb-player-btns { display: flex; flex-direction: column; gap: 8px; }
    .sb-pbtn { padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); background: #1a1a1f; color: #fff; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
    .sb-pbtn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,136,0.3); }

    .col-center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); overflow-y: auto; height: 100%; }
    .live-player-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0; overflow: hidden; }
    #video-player, #iframe-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    #iframe-player { display: none; }
    @media (min-width: 1101px) { #iframe-player { transform: scale(1.12); transform-origin: center 5%; } }

    /* ── BANNIERE MYSTAKE SOUS LE LECTEUR ── */
    .mystake-banner { text-align: center; padding: 15px; background: #050505; border-bottom: 1px solid var(--border); }
    .mystake-btn { background: linear-gradient(90deg, #00b09b, #96c93d); color: #ffffff !important; padding: 12px 20px; font-size: 15px; font-weight: 800; text-transform: uppercase; border-radius: 8px; display: inline-block; box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4); transition: all 0.3s ease; animation: pulse 2s infinite; width: 100%; max-width: 650px; text-decoration: none; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

    .player-footer { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #000; gap: 15px; }
    .match-inline { font-size: 16px; font-weight: 800; margin: 0; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .stream-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; color: #fff; cursor: pointer; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
    .btn-x-sm { background: #070707; } .btn-telegram-sm { background: #289cd8; } .btn-discord-sm { background: #5865f2; }
    .btn-iptv { background: #12bb57; color: #fff; font-size: 12px; padding: 8px 16px; border-color: #12bb57; box-shadow: 0 4px 15px rgba(18, 187, 87, 0.3); }

    .col-right { width: 320px; flex-shrink: 0; border-left: 1px solid var(--border); background: #000; height: 100%; position: relative; }
    #chat-container-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    @media (max-width: 1100px) {
      .shell { flex-direction: column; height: auto; overflow: visible; }
      .col-left { width: 100%; order: 2; border-right: none; border-top: 1px solid var(--border); height: auto; }
      .col-center { width: 100%; order: 1; overflow-y: visible; height: auto; }
      .col-right { width: 100%; order: 3; border-left: none; border-top: 1px solid var(--border); height: 550px; display: block; }
      .player-footer { flex-direction: column; align-items: flex-start; padding: 15px; }
      .btn-group { justify-content: flex-start; margin-top: 10px; }
      .mystake-btn { font-size: 13px; padding: 10px; } 
    }
  </style>
</head>
<body>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getDatabase, ref, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyCznQgA4zvs1dhZQzqtPqjfabsbBhEmvhU", 
        authDomain: "akhh-3b20d.firebaseapp.com", 
        databaseURL: "https://akhh-3b20d-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "akhh-3b20d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id');
    
    const video = document.getElementById('video-player');
    const iframe = document.getElementById('iframe-player');
    let hls;

    if (!matchId) {
        document.getElementById('matchFooter').innerText = "Retour à l'accueil...";
    } else {
        const userId = 'user_' + Math.random().toString(36).substr(2, 9);
        const viewerRef = ref(rtdb, `viewers/${matchId}/${userId}`);
        
        set(viewerRef, true);
        onDisconnect(viewerRef).remove();

        getDoc(doc(db, "streams", matchId)).then((docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                let titre = data.nom;
                if (titre.toLowerCase().includes(" vs ")) {
                    titre = titre.replace(/ vs /i, ' <span style="background:#ff6b00; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; vertical-align:middle; margin:0 5px;">VS</span> ');
                }
                document.getElementById('matchFooter').innerHTML = titre;

                const serversContainer = document.getElementById('server-buttons-container');
                let sourcesList = data.sources || (data.url ? [{ nom: "Serveur 1", url: data.url }] : []);

                if(sourcesList.length > 0) {
                    sourcesList.forEach((src, index) => {
                        const btn = document.createElement('button');
                        btn.className = `sb-pbtn ${index === 0 ? 'active' : ''}`;
                        btn.innerText = src.nom;
                        btn.onclick = () => {
                            document.querySelectorAll('.sb-pbtn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            loadStream(src.url);
                        };
                        serversContainer.appendChild(btn);
                    });
                    loadStream(sourcesList[0].url);
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    }

    function loadStream(url) {
        if (!url) return;
        if (hls) hls.destroy();

        if (url.includes('.m3u8')) {
            iframe.style.display = 'none'; video.style.display = 'block';
            if (Hls.isSupported()) {
                hls = new Hls({ capLevelToPlayerSize: true, maxBufferLength: 30 });
                hls.loadSource(url); hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log("Autoplay bloqué")));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play().catch(e => console.log("Autoplay bloqué")));
            }
        } else {
            video.style.display = 'none'; video.pause();
            iframe.style.display = 'block'; iframe.src = url;
        }
    }
  </script>
